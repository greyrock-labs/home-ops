---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/v1/service.json
apiVersion: v1
kind: Service
metadata:
  name: victoria-logs-syslog
  annotations:
    lbipam.cilium.io/ips: 10.1.25.44
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  ports:
    - name: syslog-udp
      port: 514
      protocol: UDP
      targetPort: syslog-udp
  selector:
    app: server
    app.kubernetes.io/instance: victoria-logs
    app.kubernetes.io/name: victoria-logs-single
