---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-logs
spec:
  chartRef:
    kind: OCIRepository
    name: victoria-logs
  interval: 30m
  values:
    fullnameOverride: victoria-logs
    server:
      extraArgs:
        syslog.timezone: America/New_York
      persistentVolume:
        enabled: true
        size: 20Gi
        storageClassName: miroir-local
      retentionPeriod: 14d
      route:
        enabled: true
        hostnames:
          - victoria-logs.greyrock.io
        parentRefs:
          - name: envoy-internal
            namespace: network
      serviceMonitor:
        enabled: true
      syslog:
        udp:
          - name: syslog-udp
            extraFields: '{"log_source":"syslog"}'
            streamFields: '["remote_ip"]'
            useLocalTimestamp: true
            useRemoteIP: true
            value: :5140
    dashboards:
      enabled: true
      grafanaOperator:
        enabled: true
        spec:
          folderRef: victoria-logs
