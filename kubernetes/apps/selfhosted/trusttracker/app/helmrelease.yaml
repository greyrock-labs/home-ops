---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trusttracker
spec:
  chartRef:
    kind: OCIRepository
    name: trusttracker
  interval: 30m
  values:
    controllers:
      trusttracker:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            runAsGroup: 2000
            runAsNonRoot: true
            runAsUser: 2000
        containers:
          app:
            image:
              repository: ghcr.io/static-web-server/static-web-server
              tag: 2.44.3@sha256:ccf2d666ffe5f8ef2ec96bc40f07757605998c04b78f7d8fdb98a584dd4f5717
            env:
              SERVER_PORT: &port 8080
              SERVER_ROOT: /public
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            resources:
              requests:
                cpu: 5m
              limits:
                memory: 64Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    persistence:
      content:
        type: configMap
        name: trusttracker-configmap
        globalMounts:
          # static-web-server refuses symlinks by default; subPath avoids the ConfigMap's ..data symlinks.
          - path: /public/index.html
            subPath: index.html
            readOnly: true
    route:
      app:
        hostnames:
          - trusttracker.cadshosting.com
        parentRefs:
          - group: gateway.networking.k8s.io
            kind: ListenerSet
            name: envoy-external-cadshosting
            namespace: network
    service:
      app:
        ports:
          http:
            port: *port
