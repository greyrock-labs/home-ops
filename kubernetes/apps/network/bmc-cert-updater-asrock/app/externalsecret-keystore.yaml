---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: internal-greyrock-io-p12
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: internal-greyrock-io-p12-password
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: BMC Certs
        property: printer-p12-password
