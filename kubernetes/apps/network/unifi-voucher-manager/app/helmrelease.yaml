---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: unifi-voucher-manager
spec:
  chartRef:
    kind: OCIRepository
    name: unifi-voucher-manager
  interval: 30m
  values:
    controllers:
      unifi-voucher-manager:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          seed-public:
            image:
              repository: etiennecollin/unifi-voucher-manager
              tag: 1.5.0@sha256:f558783ce58cc38e9f232f6a69f6a69ed64fb2d25337fea443f7b53a4bd184ed
            command:
              - sh
              - -c
              - cp -R /app/frontend/public/. /work/
        containers:
          app:
            image:
              repository: etiennecollin/unifi-voucher-manager
              tag: 1.5.0@sha256:f558783ce58cc38e9f232f6a69f6a69ed64fb2d25337fea443f7b53a4bd184ed
            env:
              GUEST_SUBNETWORK: 192.168.23.0/24
              TIMEZONE: America/New_York
              UNIFI_CONTROLLER_URL: https://office-gw.internal.greyrock.io
              UNIFI_HAS_VALID_CERT: "true"
              UNIFI_SITE_ID: default
              WIFI_HIDDEN: "false"
              WIFI_PASSWORD: ""
              WIFI_SSID: Grey Rock Guest
              WIFI_TYPE: nopass
            envFrom:
              - secretRef:
                  name: unifi-voucher-manager-secret
            probes:
              liveness:
                enabled: true
                spec:
                  failureThreshold: 5
                  periodSeconds: 30
                  timeoutSeconds: 5
              readiness:
                enabled: true
                spec:
                  failureThreshold: 5
                  periodSeconds: 10
                  timeoutSeconds: 5
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    persistence:
      tmpfs:
        type: emptyDir
        advancedMounts:
          unifi-voucher-manager:
            app:
              - path: /app/frontend/public
            seed-public:
              - path: /work
    route:
      app:
        hostnames:
          - voucher.greyrock.io
        parentRefs:
          - name: envoy-internal
            namespace: network
    service:
      app:
        ports:
          http:
            port: 3000
