---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: printer-cert-updater-brother
spec:
  chartRef:
    kind: OCIRepository
    name: printer-cert-updater-brother
  interval: 30m
  values:
    controllers:
      printer-cert-updater-brother:
        type: cronjob
        cronjob:
          # Activating a certificate restarts the printer's web server, so run
          # this at midday rather than overnight.
          schedule: "0 12 * * *"
          backoffLimit: 0
          concurrencyPolicy: Forbid
          failedJobsHistory: 1
          successfulJobsHistory: 1
          ttlSecondsAfterFinished: 86400
        pod:
          labels:
            egress.policy.home.arpa/block-all: "true"
          securityContext:
            runAsGroup: 100
            runAsNonRoot: true
            runAsUser: 100
        initContainers:
          # The printer refuses a PKCS#12 that carries CA certificates, and it
          # predates the AES/PBKDF2 defaults, so build a leaf-only bundle with
          # the SHA-1/3DES algorithms its firmware understands. cert-manager's
          # own keystore cannot be used: it always embeds the chain.
          bundle:
            image:
              repository: docker.io/alpine/openssl
              tag: 3.5.8@sha256:6aa2be0ed55a61fff35583e5763c2ea8288bcd3549d316b954b01eec32fb7006
            command:
              - /bin/sh
              - -c
              - |
                set -eu
                awk '/-----BEGIN CERTIFICATE-----/{f=1} f{print} f && /-----END CERTIFICATE-----/{exit}' \
                  /certs/tls.crt > /work/leaf.crt
                openssl pkcs12 -export -out /work/cert.p12 \
                  -inkey /certs/tls.key -in /work/leaf.crt \
                  -macalg sha1 -keypbe PBE-SHA1-3DES -certpbe PBE-SHA1-3DES \
                  -passout "pass:${BROTHER_P12_PASSWORD}"
            envFrom:
              - secretRef:
                  name: printer-cert-updater-brother-secret
            resources:
              requests:
                cpu: 10m
                memory: 16Mi
              limits:
                memory: 64Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              readOnlyRootFilesystem: true
        containers:
          app:
            image:
              repository: docker.io/curlimages/curl
              tag: 8.22.0@sha256:58adaa4e8dca9c988bae2aba4ab3434a0bb2da16bbe3f92dec39ec7785166777
            command:
              - /bin/sh
              - /script/push-certs.sh
            env:
              PRINTER_CERT_NAME: "*.internal.greyrock.io"
            envFrom:
              - secretRef:
                  name: printer-cert-updater-brother-secret
            probes:
              liveness:
                enabled: false
              readiness:
                enabled: false
              startup:
                enabled: false
            resources:
              requests:
                cpu: 10m
                memory: 16Mi
              limits:
                memory: 64Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              readOnlyRootFilesystem: true
    persistence:
      certs:
        type: secret
        name: internal-greyrock-io-tls
        globalMounts:
          - path: /certs
      script:
        type: configMap
        name: printer-cert-updater-brother
        globalMounts:
          - path: /script/push-certs.sh
            subPath: push-certs.sh
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
      work:
        type: emptyDir
        globalMounts:
          - path: /work
