---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jetkvm-cert-updater
spec:
  chartRef:
    kind: OCIRepository
    name: jetkvm-cert-updater
  interval: 30m
  values:
    controllers:
      jetkvm-cert-updater:
        type: cronjob
        cronjob:
          backoffLimit: 0
          concurrencyPolicy: Forbid
          failedJobsHistory: 1
          schedule: "@daily"
          successfulJobsHistory: 1
          ttlSecondsAfterFinished: 86400
        pod:
          labels:
            egress.policy.home.arpa/block-all: "true"
          securityContext:
            fsGroup: 65534
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 65534
            runAsNonRoot: true
            runAsUser: 65534
        containers:
          app:
            image:
              repository: docker.io/kroniak/ssh-client
              tag: 3.23@sha256:53b46098c51a89161fd8afd0b85ede796044abef6488bf95c249aad58d6e5dd2
            command:
              - /bin/sh
              - /script/push-certs.sh
            env:
              JETKVM_HOST: kvm-rubberneck.internal.greyrock.io
            probes:
              liveness:
                enabled: false
              readiness:
                enabled: false
              startup:
                enabled: false
            resources:
              requests:
                cpu: 10m
                memory: 16Mi
              limits:
                memory: 64Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              readOnlyRootFilesystem: true
    externalSecrets:
      jetkvm-cert-updater:
        data:
          - remoteRef:
              key: JetKVM - SSH Key
              property: private key
            secretKey: private-key
        refreshInterval: 12h
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword-connect
    networkpolicies:
      jetkvm-cert-updater:
        type: cilium
        egress:
          - toCIDR:
              - 10.1.20.22/32
            toPorts:
              - ports:
                  - port: "22"
                    protocol: TCP
                  - port: "443"
                    protocol: TCP
    persistence:
      certs:
        type: secret
        name: internal-greyrock-io-tls
        globalMounts:
          - path: /certs
      credentials:
        type: secret
        name: jetkvm-cert-updater
        globalMounts:
          - path: /credentials
      script:
        type: configMap
        name: jetkvm-cert-updater
        globalMounts:
          - path: /script
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
