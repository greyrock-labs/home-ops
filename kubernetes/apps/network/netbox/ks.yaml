---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: netbox
spec:
  components:
    - ../../../../components/cnpg/pg18
    - ../../../../components/kopiur/backup
    - ../../../../components/valkey
  dependsOn:
    - name: cloudnative-pg-barman-plugin
      namespace: database
    - name: kanidm-instance
      namespace: security
    - name: kanidm-provision
      namespace: security
    - name: miroir
      namespace: miroir-system
  healthCheckExprs:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      failed: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'False')
      current: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'True')
  interval: 1h
  path: "./kubernetes/apps/network/netbox/app"
  postBuild:
    substitute:
      APP: netbox
      CNPG_CAPACITY: 4Gi
      KOPIUR_MOVER_GID: "1000"
      KOPIUR_MOVER_UID: "1000"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: network
