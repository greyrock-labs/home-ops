---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netbox
spec:
  dataFrom:
    - extract:
        key: NetBox
      rewrite:
        - regexp:
            source: "(.*)"
            target: "netbox_$1"
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: netbox-secret
    creationPolicy: Owner
    template:
      data:
        # Keys the chart's existingSecret must provide.
        api_token_peppers: "{\"1\": \"{{ .netbox_api_token_pepper }}\"}"
        email_password: ""
        secret_key: "{{ .netbox_secret_key }}"
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netbox-superuser
spec:
  dataFrom:
    - extract:
        key: NetBox
      rewrite:
        - regexp:
            source: "(.*)"
            target: "netbox_$1"
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: netbox-superuser
    creationPolicy: Owner
    template:
      data:
        api_token: ""
        email: "{{ .netbox_email }}"
        password: "{{ .netbox_password }}"
        username: "{{ .netbox_username }}"
