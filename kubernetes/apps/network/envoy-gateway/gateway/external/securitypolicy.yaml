---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.envoyproxy.io/securitypolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: envoy-external-crowdsec
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-external
  extAuth:
    # Public sites stay up if the bouncer is down; nothing is blocked meanwhile.
    failOpen: true
    grpc:
      backendRefs:
        - name: crowdsec-bouncer
          namespace: security
          port: 8080
