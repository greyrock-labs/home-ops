---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: printer-cert-updater
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: printer-cert-updater
      app.kubernetes.io/instance: printer-cert-updater
  egress:
    # Cilium rejects a rule carrying both toCIDR and toEntities, and an invalid
    # policy is never imported -- which leaves block-all-egress denying
    # everything. The printer is a plain address outside the cluster, so the
    # CIDR alone is what is needed. DNS comes from allow-dns-egress.
    - toCIDR:
        - 10.1.10.218/32
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
