---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: printer-cert-updater
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: printer-cert-updater-secret
    creationPolicy: Owner
  data:
    - secretKey: BROTHER_PASSWORD
      remoteRef:
        key: BMC Certs
        property: brother-password
    - secretKey: BROTHER_P12_PASSWORD
      remoteRef:
        key: BMC Certs
        property: printer-p12-password
