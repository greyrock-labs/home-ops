---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bmc-cert-updater-supermicro
spec:
  chartRef:
    kind: OCIRepository
    name: bmc-cert-updater-supermicro
  interval: 30m
  values:
    externalSecrets:
      bmc-cert-updater-supermicro:
        refreshInterval: 12h
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword-connect
        data:
          - secretKey: UPDATER_USERNAME
            remoteRef:
              key: Cert Updater
              property: updater-username
          - secretKey: HOMEASSISTANT_PASSWORD
            remoteRef:
              key: Cert Updater
              property: homeassistant-password
    networkpolicies:
      bmc-cert-updater-supermicro:
        type: cilium
        endpointSelector:
          matchLabels:
            app.kubernetes.io/name: bmc-cert-updater-supermicro
            app.kubernetes.io/instance: bmc-cert-updater-supermicro
        egress:
          # Cilium rejects a rule carrying both toCIDR and toEntities, and an invalid
          # policy is never imported -- which leaves block-all-egress denying
          # everything. The BMCs are plain addresses outside the cluster, so the CIDR
          # alone is what is needed. DNS comes from allow-dns-egress.
          - toCIDR:
              - 10.1.20.14/32
            toPorts:
              - ports:
                  - port: "443"
                    protocol: TCP
    controllers:
      bmc-cert-updater-supermicro:
        type: cronjob
        cronjob:
          schedule: "@daily"
          backoffLimit: 0
          concurrencyPolicy: Forbid
          failedJobsHistory: 1
          successfulJobsHistory: 1
          ttlSecondsAfterFinished: 86400
        pod:
          labels:
            egress.policy.home.arpa/block-all: "true"
          securityContext:
            runAsGroup: 100
            runAsNonRoot: true
            runAsUser: 100
        containers:
          app:
            image:
              repository: docker.io/curlimages/curl
              tag: 8.22.0@sha256:58adaa4e8dca9c988bae2aba4ab3434a0bb2da16bbe3f92dec39ec7785166777
            command:
              - /bin/sh
              - /script/push-certs-supermicro.sh
            envFrom:
              - externalSecretRef:
                  identifier: bmc-cert-updater-supermicro
            probes:
              liveness:
                enabled: false
              readiness:
                enabled: false
              startup:
                enabled: false
            resources:
              requests:
                cpu: 10m
                memory: 16Mi
              limits:
                memory: 64Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              readOnlyRootFilesystem: true
    persistence:
      certs:
        type: secret
        name: internal-greyrock-io-tls
        globalMounts:
          - path: /certs
      script:
        type: configMap
        name: bmc-cert-updater-supermicro
        globalMounts:
          - path: /script/push-certs-supermicro.sh
            subPath: push-certs-supermicro.sh
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
