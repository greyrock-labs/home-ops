---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: unleashed-voucher-manager
spec:
  chartRef:
    kind: OCIRepository
    name: unleashed-voucher-manager
  interval: 30m
  values:
    controllers:
      unleashed-voucher-manager:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          seed-public:
            image:
              repository: ghcr.io/greyrock-labs/unleashed-voucher-manager
              tag: 1.2.3@sha256:2e1f06140fa55a795d16df586464f05575708154e291f4078fa63c8331b3cbf0
            command:
              - sh
              - -c
              - cp -a /app/frontend/public/. /work/
        containers:
          app:
            image:
              repository: ghcr.io/greyrock-labs/unleashed-voucher-manager
              tag: 1.2.3@sha256:2e1f06140fa55a795d16df586464f05575708154e291f4078fa63c8331b3cbf0
            env:
              GUEST_SUBNETWORK: 192.168.23.0/24
              TIMEZONE: America/New_York
              UNLEASHED_SSID: Grey Rock Guest
              UNLEASHED_URL: https://unleashed.internal.greyrock.io
              WIFI_HIDDEN: "false"
              WIFI_PASSWORD: ""
              WIFI_SSID: Grey Rock Guest
              WIFI_TYPE: nopass
            envFrom:
              - secretRef:
                  name: unleashed-voucher-manager-secret
            probes:
              liveness:
                enabled: true
                spec:
                  failureThreshold: 5
                  periodSeconds: 30
                  timeoutSeconds: 5
              readiness:
                enabled: true
                spec:
                  failureThreshold: 5
                  periodSeconds: 10
                  timeoutSeconds: 5
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    persistence:
      tmpfs:
        type: emptyDir
        advancedMounts:
          unleashed-voucher-manager:
            app:
              - path: /app/frontend/public
            seed-public:
              - path: /work
    route:
      app:
        hostnames:
          - voucher.greyrock.io
        parentRefs:
          - name: envoy-internal
            namespace: network
    service:
      app:
        ports:
          http:
            port: 3000
