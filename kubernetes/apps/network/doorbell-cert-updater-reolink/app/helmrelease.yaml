---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: doorbell-cert-updater-reolink
spec:
  chartRef:
    kind: OCIRepository
    name: doorbell-cert-updater-reolink
  interval: 30m
  values:
    externalSecrets:
      doorbell-cert-updater-reolink:
        refreshInterval: 12h
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword-connect
        data:
          - secretKey: UPDATER_USERNAME
            remoteRef:
              key: Cert Updater
              property: updater-username
          - secretKey: REOLINK_PASSWORD
            remoteRef:
              key: Cert Updater
              property: courtyard-porch-doorbell
    networkpolicies:
      doorbell-cert-updater-reolink:
        type: cilium
        endpointSelector:
          matchLabels:
            app.kubernetes.io/name: doorbell-cert-updater-reolink
            app.kubernetes.io/instance: doorbell-cert-updater-reolink
        egress:
          # Cilium rejects a rule carrying both toCIDR and toEntities, and an invalid
          # policy is never imported -- which leaves block-all-egress denying
          # everything. The doorbell is a plain address outside the cluster, so the
          # CIDR alone is what is needed. DNS comes from allow-dns-egress.
          - toCIDR:
              - 10.1.60.10/32
            toPorts:
              - ports:
                  - port: "443"
                    protocol: TCP
    controllers:
      doorbell-cert-updater-reolink:
        type: cronjob
        cronjob:
          # Importing a certificate restarts the doorbell's web server. A run
          # only imports when the served certificate actually changed -- about
          # once per renewal.
          schedule: "0 3 * * *"
          backoffLimit: 0
          concurrencyPolicy: Forbid
          failedJobsHistory: 1
          successfulJobsHistory: 1
          ttlSecondsAfterFinished: 86400
        pod:
          labels:
            egress.policy.home.arpa/block-all: "true"
          securityContext:
            runAsGroup: 100
            runAsNonRoot: true
            runAsUser: 100
        containers:
          app:
            image:
              repository: docker.io/curlimages/curl
              tag: 8.22.0@sha256:58adaa4e8dca9c988bae2aba4ab3434a0bb2da16bbe3f92dec39ec7785166777
            command:
              - /bin/sh
              - /script/push-certs.sh
            env:
              REOLINK_HOST: courtyard-porch-doorbell.internal.greyrock.io
            envFrom:
              - externalSecretRef:
                  identifier: doorbell-cert-updater-reolink
            probes:
              liveness:
                enabled: false
              readiness:
                enabled: false
              startup:
                enabled: false
            resources:
              requests:
                cpu: 10m
                memory: 16Mi
              limits:
                memory: 64Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              readOnlyRootFilesystem: true
    persistence:
      certs:
        type: secret
        name: internal-greyrock-io-tls
        globalMounts:
          - path: /certs
      script:
        type: configMap
        name: doorbell-cert-updater-reolink
        globalMounts:
          - path: /script/push-certs.sh
            subPath: push-certs.sh
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
