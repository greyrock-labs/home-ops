---
# yaml-language-server: $schema=https://k8s-schemas.greyrock.io/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cert-manager-cloudflare
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: cert-manager-cloudflare-secret
    creationPolicy: Owner
  data:
    - secretKey: api_token
      remoteRef:
        key: Cloudflare - Cert Manager
        property: password
