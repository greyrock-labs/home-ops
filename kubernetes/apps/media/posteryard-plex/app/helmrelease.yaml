---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: posteryard-plex
spec:
  chartRef:
    kind: OCIRepository
    name: posteryard-plex
  interval: 30m
  values:
    controllers:
      posteryard-plex:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          labels:
            egress.policy.home.arpa/internet: "true"
          securityContext:
            fsGroup: 2000
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 2000
            runAsNonRoot: true
            runAsUser: 2000
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/sandobserver/posteryard
              tag: 0.10.4@sha256:e12f99f4e7fcc33a7d8a9b1c59e4dbf05a9f172b2412fbf3cd284af0a2a19e52
            env:
              DATA_DIR: /data
              DRY_RUN: "false"
              LIBRARIES: Movies,TV Shows
              LISTEN_PORT: &httpPort 8000
              PLEX_URL: http://plex.media.svc.cluster.local:32400
              STATUS_LABELS: "false"
            envFrom:
              - secretRef:
                  name: posteryard-plex-secret
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *httpPort
                  periodSeconds: 60
                  timeoutSeconds: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *httpPort
                  periodSeconds: 30
                  timeoutSeconds: 5
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *httpPort
                  failureThreshold: 30
                  periodSeconds: 10
                  timeoutSeconds: 5
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 1536Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    networkpolicies:
      posteryard-plex:
        type: cilium
        egress:
          - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: media
                  app.kubernetes.io/name: plex
            toPorts:
              - ports:
                  - port: "32400"
                    protocol: TCP
    persistence:
      data:
        existingClaim: posteryard-plex
        globalMounts:
          - path: /data
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp
    service:
      app:
        ports:
          http:
            port: *httpPort
