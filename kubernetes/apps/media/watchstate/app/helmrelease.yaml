---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: watchstate
spec:
  chartRef:
    kind: OCIRepository
    name: watchstate
  interval: 30m
  values:
    networkpolicies:
      watchstate:
        type: cilium
        endpointSelector:
          matchLabels:
            app.kubernetes.io/name: watchstate
            app.kubernetes.io/instance: watchstate
        egress:
          - toEndpoints:
              - matchLabels:
                  k8s:app.kubernetes.io/name: jellyfin
            toPorts:
              - ports:
                  - port: "8096"
                    protocol: TCP
          - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: media
                  app.kubernetes.io/name: plex
            toPorts:
              - ports:
                  - port: "32400"
                    protocol: TCP
        ingress:
          - fromEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: network
                  gateway.networking.k8s.io/gateway-name: envoy-internal
            toPorts:
              - ports:
                  - port: "8080"
                    protocol: TCP
          - fromEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: media
                  app.kubernetes.io/name: jellyfin
            toPorts:
              - ports:
                  - port: "8080"
                    protocol: TCP
          - fromEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: media
                  app.kubernetes.io/name: plex
            toPorts:
              - ports:
                  - port: "8080"
                    protocol: TCP
    controllers:
      watchstate:
        pod:
          labels:
            egress.policy.home.arpa/internet: "true"
          securityContext:
            fsGroup: 2000
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 2000
            runAsUser: 2000
        containers:
          app:
            image:
              repository: ghcr.io/arabcoders/watchstate
              tag: v1.10.6
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              readOnlyRootFilesystem: true
    persistence:
      config:
        existingClaim: watchstate
      tmpfs:
        type: emptyDir
        advancedMounts:
          watchstate:
            app:
              - path: /tmp
                subPath: tmp
    route:
      app:
        hostnames:
          - watchstate.greyrock.io
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
    service:
      app:
        ports:
          http:
            port: 8080
