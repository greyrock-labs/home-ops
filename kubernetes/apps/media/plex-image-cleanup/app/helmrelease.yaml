---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: plex-image-cleanup
spec:
  chartRef:
    kind: OCIRepository
    name: plex-image-cleanup
  interval: 30m
  dependsOn:
    - name: plex
      namespace: media
  values:
    externalSecrets:
      plex-image-cleanup:
        refreshInterval: 12h
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword-connect
        data:
          - secretKey: PLEX_TOKEN
            remoteRef:
              key: plex
              property: PLEX_TOKEN
    networkpolicies:
      plex-image-cleanup:
        type: cilium
        endpointSelector:
          matchLabels:
            app.kubernetes.io/name: plex-image-cleanup
            app.kubernetes.io/instance: plex-image-cleanup
        egress:
          - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: media
                  app.kubernetes.io/name: plex
            toPorts:
              - ports:
                  - port: "32400"
                    protocol: TCP
    controllers:
      plex-image-cleanup:
        type: cronjob
        cronjob:
          schedule: "30 8 * * 6"
          backoffLimit: 0
          concurrencyPolicy: Forbid
          failedJobsHistory: 1
          successfulJobsHistory: 0
        pod:
          labels:
            egress.policy.home.arpa/block-all: "true"
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchExpressions:
                      - key: app.kubernetes.io/name
                        operator: In
                        values:
                          - plex
                  topologyKey: kubernetes.io/hostname
          securityContext:
            runAsGroup: 2000
            runAsNonRoot: true
            runAsUser: 2000
        containers:
          app:
            image:
              repository: docker.io/meisnate12/plex-image-cleanup
              tag: v1.0.2
            env:
              MODE: remove
              PHOTO_TRANSCODER: "true"
              PLEX_PATH: /data/plex_config/Library/Application Support/Plex Media Server
              PLEX_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: "{{ .Release.Name }}"
                    key: PLEX_TOKEN
              PLEX_URL: http://plex.media.svc.cluster.local:32400
            probes:
              liveness:
                enabled: false
              readiness:
                enabled: false
              startup:
                enabled: false
            resources:
              requests:
                cpu: 25m
              limits:
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              readOnlyRootFilesystem: true
    persistence:
      config:
        type: emptyDir
        advancedMounts:
          plex-image-cleanup:
            app:
              - path: /config
      plex-cache:
        existingClaim: plex-cache
        advancedMounts:
          plex-image-cleanup:
            app:
              - path: /data/plex_config/Library/Application Support/Plex Media Server/Cache
      plex-config:
        existingClaim: plex-config
        advancedMounts:
          plex-image-cleanup:
            app:
              - path: /data/plex_config
