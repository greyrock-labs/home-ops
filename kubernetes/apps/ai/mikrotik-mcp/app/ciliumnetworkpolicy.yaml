---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: mikrotik-mcp
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: mikrotik-mcp
  # The MCP endpoint has no auth of its own; only agentgateway may reach it.
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ai
            app.kubernetes.io/name: agentgateway
            app.kubernetes.io/instance: agentgateway
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
  egress:
    - toCIDR:
        - 10.1.99.1/32
        - 10.255.255.10/32
        - 10.1.99.20/32
        - 10.1.99.30/32
      toPorts:
        - ports:
            - port: "22"
              protocol: TCP
