---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mikrotik-mcp
spec:
  data:
    - secretKey: password
      remoteRef:
        key: MikroTik MCP
        property: password
    - secretKey: username
      remoteRef:
        key: MikroTik MCP
        property: username
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: mikrotik-mcp-inventory
    creationPolicy: Owner
    template:
      data:
        # Inventory entries do not inherit global credentials, so each carries them.
        # Addresses are the management IPs in NetBox; the cluster reaches them as the
        # node address (10.1.20.x), which the RouterOS user is restricted to.
        inventory.yaml: |
          - title: office-gw
            host: 10.1.99.1
            username: '{{ .username }}'
            password: '{{ .password }}'
            tags: [router]
          - title: office-crs309
            host: 10.255.255.10
            username: '{{ .username }}'
            password: '{{ .password }}'
            tags: [switch, l3]
          - title: gameroom-crs309
            host: 10.1.99.20
            username: '{{ .username }}'
            password: '{{ .password }}'
            tags: [switch]
          - title: garage-crs309
            host: 10.1.99.30
            username: '{{ .username }}'
            password: '{{ .password }}'
            tags: [switch]
