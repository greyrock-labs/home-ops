---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: home-assistant-mcp
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: home-assistant-mcp
  # ha-mcp has no authentication of its own here: only LiteLLM may call it.
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ai
            app.kubernetes.io/name: litellm
      toPorts:
        - ports:
            - port: "8086"
              protocol: TCP
  # Home Assistant is a plain address outside the cluster (home.internal.greyrock.io).
  # DNS is allowed cluster-wide; the block-all pod label removes the default allow-all egress.
  egress:
    - toCIDR:
        - 10.1.10.3/32
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
