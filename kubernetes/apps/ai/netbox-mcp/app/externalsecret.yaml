---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netbox-mcp
spec:
  data:
    # Bearer token agentgateway sends to the server (backendAuth on the mcp-netbox route).
    - secretKey: MCP_AUTH_TOKEN
      remoteRef:
        key: NetBox MCP
        property: mcp_auth_token
    # v2 API token (nbt_...) of the non-superuser NetBox user netbox-mcp.
    - secretKey: NETBOX_TOKEN
      remoteRef:
        key: NetBox MCP
        property: netbox_token
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: netbox-mcp-secret
    creationPolicy: Owner
