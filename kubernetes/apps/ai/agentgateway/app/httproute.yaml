---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: agentgateway
spec:
  hostnames:
    - agentgateway.greyrock.io
  parentRefs:
    - name: envoy-internal
      namespace: network
  rules:
    # MCP listener only; the LLM listener stays cluster-internal.
    - matches:
        - path:
            type: PathPrefix
            value: /mcp/
      backendRefs:
        - name: agentgateway
          port: 8081
