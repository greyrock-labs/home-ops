---
# Confidential client for Hermes WebUI's native OIDC provider. kaniop writes the
# credentials to hermes-kanidm-oauth2-credentials; WebUI sends the secret with PKCE.
# Issuer: https://idm.greyrock.io/oauth2/openid/hermes
apiVersion: kaniop.rs/v1beta1
kind: KanidmOAuth2Client
metadata:
  name: hermes
spec:
  kanidmRef:
    name: sso
    namespace: security
  displayname: Hermes
  origin: https://hermes.greyrock.io/
  redirectUrl:
    - https://hermes.greyrock.io/api/auth/oidc/callback
  # Every signed-in user gets full agent (shell) access. The group is managed in
  # kanidm-provision and is checked both by Kanidm and by WebUI's allowlist.
  scopeMap:
    - group: hermes_admins@idm.greyrock.io
      scopes:
        - openid
        - profile
        - email
  claimMap:
    - name: hermes_access
      valuesMap:
        - group: hermes_admins@idm.greyrock.io
          values:
            - admin
      joinStrategy: csv
  preferShortUsername: true
  strictRedirectUrl: true
  disableConsentPrompt: true
