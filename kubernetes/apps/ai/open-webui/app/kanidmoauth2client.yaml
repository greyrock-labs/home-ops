---
apiVersion: kaniop.rs/v1beta1
kind: KanidmOAuth2Client
metadata:
  name: openwebui
spec:
  kanidmRef:
    name: kanidm
    namespace: security
  displayname: Open WebUI
  origin: https://chat.greyrock.io/oauth/oidc/callback
  redirectUrl: []
  scopeMap:
    - group: openwebui_users@idm.greyrock.io
      scopes:
        - openid
        - profile
        - email
  strictRedirectUrl: true
  allowInsecureClientDisablePkce: true
  secretKeyAliases:
    clientId:
      - OAUTH_CLIENT_ID
    clientSecret:
      - OAUTH_CLIENT_SECRET
  disableConsentPrompt: true
