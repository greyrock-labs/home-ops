---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-kanidm-provision
spec:
  refreshInterval: 30m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: forgejo-kanidm-provision
    template:
      type: Opaque
      engineVersion: v2
      data:
        identity: "{{ .privateKey }}"
        known_hosts: "git.greyrock.io ssh-rsa "
  data:
    - secretKey: privateKey
      remoteRef:
        key: Forgejo - Kanidm Provision - Flux
        property: private_key
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/source.toolkit.fluxcd.io/gitrepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: kanidm-provision
spec:
  interval: 1h
  url: ssh://git@git.greyrock.io/todd/kanidm-provision.git
  ref:
    branch: main
  secretRef:
    name: forgejo-kanidm-provision
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kanidm-provision
spec:
  interval: 1h
  prune: true
  sourceRef:
    kind: GitRepository
    name: kanidm-provision
