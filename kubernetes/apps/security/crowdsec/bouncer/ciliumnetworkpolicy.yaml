---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: crowdsec-bouncer-ingress
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: envoy-proxy-bouncer
  ingress:
    # Only envoy-external asks the bouncer for ext_authz verdicts.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: network
            gateway.networking.k8s.io/gateway-name: envoy-external
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
