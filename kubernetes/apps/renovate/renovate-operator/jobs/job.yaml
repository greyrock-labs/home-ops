---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/renovate-operator.mogenius.com/renovatejob_v1alpha1.json
apiVersion: renovate-operator.mogenius.com/v1alpha1
kind: RenovateJob
metadata:
  name: forgejo-greyrock
  namespace: renovate
spec:
  discoveryFilters:
    - greyrock-labs/*
  extraEnv:
    - name: LOG_LEVEL
      value: debug
    - name: RENOVATE_ALLOWED_COMMANDS
      value: |-
        ["pnpm run bundle"]
    # npm 12 refuses registry tarballs of packages with bundleDependencies
    # under --package-lock-only (EALLOWREMOTE)
    # drop once https://github.com/npm/cli/issues/9800 is fixed
    - name: RENOVATE_CONSTRAINTS
      value: |-
        {"npm": "^11"}
    - name: RENOVATE_HOST_RULES
      value: >-
        [
          {
            "matchHost": "https://git.greyrock.io",
            "allowInternal": true
          }
        ]
  image: ghcr.io/renovatebot/renovate:44.257.9
  parallelism: 5
  provider:
    name: forgejo
    endpoint: https://git.greyrock.io/api/v1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
  scratchVolume:
    enabled: true
    ephemeral:
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 10Gi
          storageClassName: miroir-local
  schedule: 0 * * * *
  secretRef: renovate-secret
  webhook:
    enabled: true
    authentication:
      enabled: true
      secretRef:
        name: renovate-secret
        key: RENOVATE_WEBHOOK_TOKEN
    sync:
      enabled: true
