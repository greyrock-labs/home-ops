---
apiVersion: v1
kind: Secret
metadata:
  name: onepassword-connect-credentials-secret
stringData:
  # Literal blocks survive kustomize build; quoted scalars do not (they are
  # re-emitted plain, so op inject lands the raw credentials JSON in a map context).
  1password-credentials.json: |
    op://Kubernetes/1Password Connect/credentials
---
apiVersion: v1
kind: Secret
metadata:
  name: onepassword-connect-vault-secret
stringData:
  token: op://Kubernetes/1Password Connect/token
