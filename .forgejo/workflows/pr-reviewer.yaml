---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: AI PR Review

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - labeled

enable-openid-connect: true

concurrency:
  group: ${{ forgejo.workflow }}-${{ forgejo.event.pull_request.number || forgejo.ref }}${{ forgejo.event.action == 'labeled' && format('-label-{0}', forgejo.run_id) || '' }}
  cancel-in-progress: true

jobs:
  review:
    name: AI PR Review
    if: ${{ !forgejo.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PR
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ forgejo.event.pull_request.head.sha }}

      - name: AI PR Review
        uses: https://github.com/misospace/pr-reviewer-action@c86f3e94191c9078e92714b10f39deb8d3466268 # v3.2.0
        with:
          platform: forgejo
          forgejo-api-url: http://forgejo-http.dev.svc.cluster.local:3000/
          forgejo-auth-method: authorized_integration
          forgejo-authorized-integration-audience: u:1:f378a1bb-2681-44b5-aae6-46a0c097c62e
          allowed-source-hosts: github.com,api.github.com,gitlab.com,registry.terraform.io,artifacthub.io,git.greyrock.io,codeberg.org
          ai-base-url: http://litellm.ai.svc.cluster.local:4000/v1
          ai-api-format: anthropic
          ai-model: minimax/MiniMax-M2-7-anthropic
          ai-api-key: ${{ secrets.LITELLM_API_KEY }}
          ai-max-tokens: "16000"
          ai-primary-retries: "2"
          ai-primary-retry-delay-sec: "5"
          ai-connect-timeout-sec: "10"
          ai-fallback-base-url: http://litellm.ai.svc.cluster.local:4000/v1
          ai-fallback-api-format: openai
          ai-fallback-model: opencode-go/qwen3.6-plus
          ai-fallback-api-key: ${{ secrets.LITELLM_API_KEY }}
          evidence-providers-file: .forgejo/konflate-evidence-providers.json
          inline-findings: "true"
          on-model-failure: notice
          publish-review-comment: "true"
          system-prompt-file: .agents/instructions/pr-review.instructions.md
          system-prompt-mode: append
          tool-mode: native_loop
          tool-max-requests: "4"
          tool-max-rounds: "2"
          tool-loop-wall-clock-sec: "180"
          tool-request-timeout-sec: "15"
          tool-max-response-bytes: "12000"
          tool-turn-timeout-sec: "60"
          tool-corpus-max-bytes: "30000"
          tool-max-tokens-per-turn: "8000"
          tool-allowed-gh-api-repos: "todd/home-ops"
          tool-enable-for-forks: "false"
          tool-mcp-servers: "konflate=http://konflate.flux-system.svc.cluster.local:8080/mcp"
