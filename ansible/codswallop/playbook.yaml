---
- name: Bootstrap TrueNAS
  hosts: all
  become: true
  gather_facts: false
  vars:
    ansible_user: truenas_admin
    ansible_python_interpreter: auto_silent

  tasks:
    - name: Check host connectivity
      ansible.builtin.ping:

    - name: Read secrets from 1Password
      ansible.builtin.shell: "op read 'op://{{ item.key }}' < /dev/null"
      delegate_to: localhost
      become: false
      loop:
        - key: Automation/doco-cd/1pw_sa_token
          var: doco_1pw_sa_token
        - key: Automation/doco-cd/api_secret
          var: doco_api_secret
        - key: Automation/doco-cd/webhook_secret
          var: doco_webhook_secret
        - key: Services/ClouDNS/codswallop-acme-auth-id
          var: cloudns_auth_id
        - key: Services/ClouDNS/codswallop-acme-auth-password
          var: cloudns_auth_password
      check_mode: false
      changed_when: false
      no_log: true
      register: secrets_raw

    - name: Set secret facts
      ansible.builtin.set_fact:
        doco_1pw_sa_token: "{{ secrets_raw.results[0].stdout }}"
        doco_api_secret: "{{ secrets_raw.results[1].stdout }}"
        doco_webhook_secret: "{{ secrets_raw.results[2].stdout }}"
        cloudns_auth_id: "{{ secrets_raw.results[3].stdout }}"
        cloudns_auth_password: "{{ secrets_raw.results[4].stdout }}"
      no_log: true

    - name: doco-cd
      vars:
        dococd_config_dir: /home/truenas_admin/.config/doco-cd
      block:
        - name: doco-cd | Create directory
          ansible.builtin.file:
            path: "{{ dococd_config_dir }}"
            state: directory
            owner: truenas_admin
            group: truenas_admin
            mode: "0700"

        - name: doco-cd | Copy docker-compose app file
          ansible.builtin.copy:
            src: ../../docker/codswallop/.doco-cd/docker-compose.app.yaml
            dest: "{{ dococd_config_dir }}/docker-compose.yaml"
            owner: truenas_admin
            group: truenas_admin
            mode: "0644"
          register: compose_file

        - name: doco-cd | Create secrets
          ansible.builtin.copy:
            dest: "{{ dococd_config_dir }}/{{ item.name }}"
            content: |
              {{ item.content }}
            owner: truenas_admin
            group: truenas_admin
            mode: "0600"
          no_log: true
          loop:
            - name: 1pw_token
              content: "{{ doco_1pw_sa_token }}"
            - name: api_secret
              content: "{{ doco_api_secret }}"
            - name: webhook_secret
              content: "{{ doco_webhook_secret }}"

        - name: doco-cd | Run docker-compose
          community.docker.docker_compose_v2:
            project_src: "{{ dococd_config_dir }}"
            files:
              - docker-compose.yaml
            pull: always
            state: present
          when: not ansible_check_mode

        - name: doco-cd | Wait for healthy
          community.docker.docker_container_info:
            name: doco-cd
          register: dococd_info
          until: dococd_info.container.State.Health.Status == "healthy"
          retries: 30
          delay: 10
          when: not ansible_check_mode

    - name: ClouDNS ACME authenticator
      vars:
        acme_dir: /mnt/tank/apps/acme
        acme_user: nobody
      block:
        - name: acme | Create directory
          ansible.builtin.file:
            path: "{{ acme_dir }}"
            state: directory
            owner: root
            group: root
            mode: "0755"

        - name: acme | Copy ClouDNS authenticator script
          ansible.builtin.copy:
            src: files/cloudns-authenticator.py
            dest: "{{ acme_dir }}/cloudns-authenticator.py"
            owner: root
            group: root
            mode: "0755"

        # Read by the script as the unprivileged user middleware runs it as, so
        # it is owned by that user rather than root.
        - name: acme | Create ClouDNS credentials
          ansible.builtin.copy:
            dest: "{{ acme_dir }}/cloudns.ini"
            content: |
              auth-id = {{ cloudns_auth_id }}
              auth-password = {{ cloudns_auth_password }}
            owner: "{{ acme_user }}"
            group: nogroup
            mode: "0400"
          no_log: true
