---
working_dir: ./docker/codswallop
auto_discovery:
  enabled: true
  depth: 1
  delete: true
external_secrets:
  DO_AUTH_TOKEN: op://Services/DigitalOcean/traefik-application-key
  UNIFI_API_KEY: op://Automation/Unifi Controller/external_dns
  GARAGE_ADMIN_TOKEN: op://Services/Garage/admin_key
  GARAGE_RPC_SECRET: op://Services/Garage/rpc_secret
  GARAGE_UI_OIDC_CLIENT_ID: op://Services/kanidm/garage_ui_client_id
  GARAGE_UI_OIDC_CLIENT_SECRET: op://Services/kanidm/garage_ui_client_secret
  REGISTRY_UI_OIDC_CLIENT_ID: op://Automation/kanidm/registry_ui_oidc_client_id
  REGISTRY_UI_OIDC_CLIENT_SECRET: op://Automation/kanidm/registry_ui_oidc_client_secret
  REGISTRY_UI_REGISTRY_AUTH: op://Services/Zot/registry-ui-auth
  REGISTRY_UI_SESSION_SECRET: op://Services/Zot/registry-ui-session-secret
  ZOT_HTPASSWD: op://Services/Zot/htpasswd
force_recreate: false
reconciliation:
  enabled: true
  interval: 3600
