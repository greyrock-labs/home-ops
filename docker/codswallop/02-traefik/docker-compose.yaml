---
configs:
  truenas-s3:
    content: |
      http:
        services:
          truenas-s3:
            loadBalancer:
              servers:
                - url: http://10.1.20.12:9000
networks:
  apps:
    name: apps
    external: false
services:
  traefik:
    command:
      - --certificatesresolvers.cf.acme.caserver=https://acme-v02.api.letsencrypt.org/directory
      - --certificatesresolvers.cf.acme.dnsChallenge.provider=cloudflare
      - --certificatesresolvers.cf.acme.dnsChallenge.resolvers=1.1.1.1:53,8.8.8.8:53
      - --certificatesresolvers.cf.acme.storage=/certs/acme.json
      - --entryPoints.web.address=:80
      - --entryPoints.web.http.redirections.entryPoint.scheme=https
      - --entryPoints.web.http.redirections.entryPoint.to=websecure
      - --entryPoints.websecure.address=:443
      - --entrypoints.websecure.http.tls=true
      - --entrypoints.websecure.http.tls.certResolver=cf
      - --entrypoints.websecure.http.tls.domains[0].main=*.greyrock.io
      - --providers.docker=true
      - --providers.docker.exposedByDefault=false
      - --providers.file.directory=/etc/traefik/dynamic
    configs:
      - source: truenas-s3
        target: /etc/traefik/dynamic/truenas-s3.yaml
    container_name: traefik
    environment:
      - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN}
    image: ghcr.io/traefik/traefik:v3.7.19@sha256:a6c0194dda77bcb804824580f36fa7edc56e315b1acfe933366c8b52844a78a4
    labels:
      dexd.enabled: 'true'
      traefik.enable: 'true'
      traefik.http.routers.truenas-s3.priority: '1000'
      traefik.http.routers.truenas-s3.rule: Host(`s3.greyrock.io`)
      traefik.http.routers.truenas-s3.service: truenas-s3@file
    networks:
      - apps
    ports:
      - 10.1.25.21:80:80
      - 10.1.25.21:443:443
    restart: unless-stopped
    volumes:
      - acme:/certs
      - /var/run/docker.sock:/var/run/docker.sock:ro
volumes:
  acme:
