---
# This file is not managed by doco-cd because it can't manage itself

secrets:
  1pw_token:
    file: /home/truenas_admin/.config/doco-cd/1pw_token
  api_keys:
    file: /home/truenas_admin/.config/doco-cd/api_keys
  webhook_secret:
    file: /home/truenas_admin/.config/doco-cd/webhook_secret
services:
  app:
    container_name: doco-cd
    environment:
      API_KEYS_FILE: /run/secrets/api_keys
      DEPLOY_CONFIG_BASE_DIR: ./docker/codswallop/
      HTTP_PORT: 8880
      LOG_LEVEL: info
      POLL_CONFIG: |-
        - url: https://github.com/greyrock-labs/home-ops.git
          reference: refs/heads/main
          interval: 3600
      SECRET_PROVIDER: 1password
      SECRET_PROVIDER_ACCESS_TOKEN_FILE: /run/secrets/1pw_token
      TZ: America/New_York
      WEBHOOK_SECRET_FILE: /run/secrets/webhook_secret
    image: ghcr.io/kimdre/doco-cd:0.136.0@sha256:fa55a3a431e479163a06dd42b8d59ceb90483e958056fd8f325b304aaf3d2a97
    ports:
      - 8880:8880
    restart: unless-stopped
    secrets:
      - 1pw_token
      - api_keys
      - webhook_secret
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - data:/data
volumes:
  data: {}
