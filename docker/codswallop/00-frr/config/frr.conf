frr version 10.7
frr defaults traditional
hostname codswallop-frr
log stdout
no ipv6 forwarding
!
router bgp 64515
 bgp router-id 10.1.20.12
 no bgp ebgp-requires-policy
 no bgp network import-check
 neighbor 10.255.0.1 remote-as 64513
 neighbor 10.255.0.1 ebgp-multihop 2
 neighbor 10.1.20.1 remote-as 64516
 !
 address-family ipv4 unicast
  network 10.1.25.21/32
 exit-address-family
exit
!
line vty
!
