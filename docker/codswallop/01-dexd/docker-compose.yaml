---
name: dexd
services:
  dexd:
    container_name: dexd
    environment:
      DEFAULT_TARGET: 10.1.25.21
      MIKROTIK_BASEURL: https://office-gw.internal.greyrock.io
      MIKROTIK_PASSWORD: ${DEXD_MIKROTIK_PASSWORD}
      MIKROTIK_USERNAME: ${DEXD_MIKROTIK_USERNAME}
    image: ghcr.io/greyrock-labs/dexd-mikrotik:1.0.2@sha256:8ad9589c3ca92ab226202bffc1937ef0eabaaba56b01ab728751aafbdef740c3
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
