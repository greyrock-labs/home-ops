---
name: dexd
services:
  dexd:
    container_name: dexd
    environment:
      DEFAULT_TARGET: 10.1.25.21
      MIKROTIK_BASEURL: https://office-gw.internal.greyrock.io
      MIKROTIK_PASSWORD: ${DEXD_MIKROTIK_PASSWORD}
      MIKROTIK_USERNAME: ${DEXD_MIKROTIK_USERNAME}
    image: ghcr.io/greyrock-labs/dexd-mikrotik:1.0.1@sha256:a8c87a2fd3b4d39d404ca375921fe3ac6567ad5b5d550a650e772db870d09269
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
