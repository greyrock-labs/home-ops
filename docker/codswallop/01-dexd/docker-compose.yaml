---
name: dexd
services:
  dexd:
    container_name: dexd
    environment:
      DEFAULT_TARGET: 10.1.25.21
      MIKROTIK_BASEURL: https://office-gw.internal.greyrock.io
      MIKROTIK_PASSWORD: ${DEXD_MIKROTIK_PASSWORD}
      MIKROTIK_USERNAME: ${DEXD_MIKROTIK_USERNAME}
    image: ghcr.io/greyrock-labs/dexd-mikrotik:1.0.2@sha256:d84060335a26dd3e59498286c1a79f0cf567835feb087ea7a8a703f2671f8495
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
